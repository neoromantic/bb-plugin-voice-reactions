<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <title>bb plugin logs voice-reactions: a reaction picked and spoken, a silent message, a skipped one (made-up data)</title>
  <rect width="1600" height="1000" fill="#0f1115"/>
  <rect x="80" y="80" width="1440" height="840" rx="18" fill="#181b22" stroke="#2a2f3a"/>
  <circle cx="122" cy="122" r="9" fill="#ff5f57"/>
  <circle cx="152" cy="122" r="9" fill="#febc2e"/>
  <circle cx="182" cy="122" r="9" fill="#28c840"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" fill="#d7dae0">
    <text x="130" y="210"><tspan fill="#7aa2f7">$</tspan> bb plugin logs voice-reactions</text>
    <text x="130" y="290" fill="#9aa1ad">you: "everything broke again, I'm done for today"</text>
    <text x="130" y="340">turn:creq_k2m7: typesafe 212ms → <tspan fill="#e0af68">grumble 60%, tired 30%</tspan></text>
    <text x="130" y="390">turn:creq_k2m7: <tspan fill="#9ece6a">spoken</tspan>, 8 chunks, 146400 bytes,</text>
    <text x="130" y="436">                first audio 934ms after the message</text>
    <text x="130" y="516" fill="#9aa1ad">you: "why does the cache test fail on CI?"</text>
    <text x="130" y="566">turn:creq_p9x2: openai 148ms → <tspan fill="#9aa1ad">none</tspan></text>
    <text x="130" y="646" fill="#9aa1ad">you: "it finally works!"   (while the first line still plays)</text>
    <text x="130" y="696">turn:creq_t4b8: typesafe 190ms → <tspan fill="#e0af68">cheer 85%</tspan></text>
    <text x="130" y="746">turn:creq_t4b8: voice busy, reaction skipped</text>
  </g>
  <g fill="none" stroke="#9ece6a" stroke-width="6" stroke-linecap="round">
    <path d="M1290 250v60M1320 225v110M1350 255v50M1380 205v150M1410 240v80M1440 262v36"/>
  </g>
</svg>
